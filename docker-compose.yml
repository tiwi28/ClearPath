services:
  db:
    image: timescale/timescaledb-ha:pg16   # PostGIS + TimescaleDB
    environment:
      POSTGRES_PASSWORD: clearpath
      POSTGRES_DB: clearpath
    ports: ["5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearpath"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:clearpath@db:5432/clearpath
      BARRIER_SOURCE: ${BARRIER_SOURCE:-fixtures}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.heigit.org/openrouteservice/v2}
      ORS_FALLBACK_PROFILE: ${ORS_FALLBACK_PROFILE-foot-hiking}  # set it empty to turn the fallback off
      ORS_FORCE_FALLBACK: ${ORS_FORCE_FALLBACK:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_API_URL: /api
      VITE_USE_POLLING: "true"
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/tests:/app/tests:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      api:
        condition: service_healthy

  # Optional local routing server for when the public ORS is down or out of quota.
  # Start it with `docker compose --profile ors up -d` and set ORS_BASE_URL=http://ors:8082/ors/v2.
  # First start builds the Toronto routing graphs (several minutes); later starts reuse them.
  ors:
    image: openrouteservice/openrouteservice:v10.1.0
    profiles: ["ors"]
    ports: ["8080:8082"]
    volumes:
      - ./ors-docker:/home/ors
    environment:
      XMS: 1g
      XMX: 3g
      ors.engine.profile_default.build.source_file: /home/ors/files/toronto.osm.pbf
      ors.engine.profile_default.build.elevation: "false"  # no elevation download; works offline
      ors.engine.profiles.driving-car.enabled: "false"
      ors.engine.profiles.foot-walking.enabled: "true"
      ors.engine.profiles.foot-hiking.enabled: "true"
      ors.engine.profiles.wheelchair.enabled: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/ors/v2/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 2m

volumes:
  pgdata:
